<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2446d1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MattNotes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Prise de notes : clavier, stylet et dessin manuscrit.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>MattNotes</title>
<style>
:root{--bg:#e8ebf1;--panel:#f7f8fa;--ink:#171a22;--mute:#6a7183;--line:#d3d8e2;--acc:#2446d1;--accfg:#fff;--hover:#e9ecf3;--danger:#d23a46;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#181c25;--ink:#e8ebf2;--mute:#8a92a6;--line:#2a303d;--acc:#8ea2ff;--accfg:#0f1218;--hover:#222836;--danger:#ff7a85}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
[hidden]{display:none!important}

#app{display:grid;grid-template-columns:300px 1fr;height:100vh;height:100dvh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(14px,env(safe-area-inset-top)) 14px 8px}
.side-top h1{font:700 20px/1 Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;margin:0;letter-spacing:-.01em}
.side-actions{display:flex;align-items:center;gap:4px}
.primary{background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.btn{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{background:var(--hover)}
.btn.danger{color:var(--danger)}
#search{margin:4px 14px 8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline-offset:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;flex:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.syncinfo{font-size:12px;color:var(--mute);padding:0 14px 8px;min-height:20px;cursor:pointer}
.syncinfo.err{color:var(--danger)}
#list{list-style:none;margin:0;padding:0;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
#list button.item{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px}
#list button.item:hover{background:var(--hover)}
#list button.item.on{background:var(--hover);box-shadow:inset 3px 0 0 var(--acc)}
.li-t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.li-t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-t time{font-weight:400;color:var(--mute);font-size:12px;flex:none}
.li-s{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.4em}
.pin{color:var(--acc)}
.trow{border-top:1px solid var(--line);padding:11px 14px}
.trow .acts{display:flex;gap:8px;margin-top:8px}
.trow .btn{padding:6px 12px;font-size:13px}
.none{color:var(--mute);padding:18px 14px}

#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.placeholder{margin:auto;color:var(--mute);padding:24px;text-align:center}
#editor{display:flex;flex-direction:column;min-height:0;flex:1;position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#title{flex:1;min-width:0;background:transparent;border:0;outline:0;font:700 19px Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;padding:6px 4px}
#title::placeholder{color:var(--mute);font-weight:400}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border:0;border-radius:8px;background:none;padding:0 8px;flex:none}
.ib:hover{background:var(--hover)}
.ib[aria-pressed=true]{background:var(--acc);color:var(--accfg)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib svg circle{fill:currentColor;stroke:none}
.ib svg .nf{fill:none;stroke:currentColor}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:8px 13px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accfg)}
.only-mobile{display:none}
.tools{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;flex:none}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px;flex:none}
.ib.t{font-size:17px;min-width:40px}
.sw{width:28px;height:28px;border-radius:50%;border:0;padding:0;flex:none;margin:0 3px}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
#colors.dim{opacity:.3;pointer-events:none}
#size{width:96px;accent-color:var(--acc)}
#fingerBtn{font-size:13px;gap:6px}

#scroller{flex:1;overflow:auto;padding:20px 16px 80px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain}
#sheet{--s:1;--f:30;--lh:calc(var(--f) * 1.78 * var(--s) * 1px);--pt:calc(40 * var(--s) * 1px);position:relative;margin:0 auto;background-color:#fffffe;color:#171a22;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 10px 32px rgba(0,0,0,.1);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
#sheet[data-bg=lines]{background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),#d3dcef calc(var(--lh) - 1px));background-size:100% var(--lh);background-position:0 var(--pt)}
#sheet[data-bg=grid]{background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),#dfe5f2 calc(var(--lh) - 1px)),linear-gradient(to right,transparent calc(var(--lh) - 1px),#dfe5f2 calc(var(--lh) - 1px));background-size:var(--lh) var(--lh);background-position:0 var(--pt)}
#sheet[data-bg=dots]{background-image:radial-gradient(circle,#b4bed5 1.3px,transparent 1.7px);background-size:var(--lh) var(--lh);background-position:calc(var(--lh) / 2) calc(var(--pt) + var(--lh) / 2)}
#bgl{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:3px}
#bgl img{position:absolute;left:0;width:100%;display:block;-webkit-user-drag:none;user-select:none}
#text{position:relative;outline:0;padding:var(--pt) calc(48 * var(--s) * 1px) calc(80 * var(--s) * 1px);min-height:var(--sh,1400px);font-family:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;font-size:calc(var(--f) * var(--s) * 1px);line-height:var(--lh);text-rendering:geometricPrecision;-webkit-text-size-adjust:100%;text-size-adjust:100%;white-space:pre-wrap;word-break:break-word;caret-color:#2446d1}
#text.empty::before{content:attr(data-ph);color:#9aa3b8;pointer-events:none}
#text div,#text p{margin:0}
#text h2{font-size:calc(var(--f) * 1.3 * var(--s) * 1px);line-height:var(--lh);margin:0;font-weight:700}
#text ul,#text ol{margin:0;padding-left:1.5em}
#text li{line-height:var(--lh)}
#text .chk{position:relative;padding-left:1.7em}
#text .cb{position:absolute;left:.15em;top:calc((var(--lh) - .95em) / 2);width:.95em;height:.95em;border:2px solid #6a7183;border-radius:.22em;cursor:pointer;-webkit-user-select:none;user-select:none}
#text .chk.done{color:#8a92a6;text-decoration:line-through}
#text .chk.done .cb{background:#2446d1;border-color:#2446d1}
#text .chk.done .cb::after{content:"";position:absolute;left:.26em;top:.06em;width:.26em;height:.5em;border:solid #fff;border-width:0 .12em .12em 0;transform:rotate(45deg)}

#objs{position:absolute;inset:0;pointer-events:none}
.obj{position:absolute;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;cursor:move}
body[data-mode=draw] .obj{pointer-events:none}
.obj img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.obj.eq{font-size:calc(var(--ef,34) * var(--s) * 1px);line-height:1.25;white-space:nowrap;color:#171a22;padding:.1em .15em}
.obj.sel{outline:2px solid #2446d1;outline-offset:2px}
.obj .rh{position:absolute;right:-12px;bottom:-12px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #2446d1;cursor:nwse-resize;touch-action:none}
.obj .oc{position:absolute;right:-6px;top:-44px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:0 4px 14px rgba(0,0,0,.2);color:var(--ink)}

#ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#live{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
body[data-mode=draw] #ink{pointer-events:auto}
body[data-mode=draw] #text{-webkit-user-select:none;user-select:none}
#selbar{position:absolute;z-index:6;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:0 4px 14px rgba(0,0,0,.2);color:var(--ink)}

#zoomPill{position:absolute;right:14px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:8;overflow:hidden}
#zoomPill button{border:0;background:none;height:38px;min-width:38px;font-weight:700;font-size:18px;padding:0 8px}
#zoomPill button:hover{background:var(--hover)}
#zoomPill #zVal{font-size:13px;min-width:54px}

.menu{position:fixed;z-index:20;max-height:calc(100vh - 72px);max-height:calc(100dvh - 72px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);min-width:240px;padding:6px;display:none}
.menu.open{display:block}
#menu{right:12px;top:calc(56px + env(safe-area-inset-top))}
#gmenu{left:14px;top:calc(56px + env(safe-area-inset-top))}
.menu .mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px}
.menu .mi:hover{background:var(--hover)}
.menu .danger{color:var(--danger)}
.menu .lab{color:var(--mute);font-size:13px;padding:8px 12px 4px}
.menu .seg{margin:0 8px 6px;display:flex}
.menu .seg button{flex:1;padding:7px 4px;font-weight:500;font-size:13px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,94vw);max-height:90vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{padding:16px 18px 8px;font-weight:700;font-size:17px}
.dlg-b{padding:0 18px 8px;max-height:62vh;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;flex-wrap:wrap}
.dlg-b p{margin:6px 0;color:var(--mute);font-size:13px}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{font-family:ui-monospace,Menlo,Consolas,monospace;min-height:84px;resize:vertical}
#eqPrev{min-height:64px;margin:8px 0;padding:10px;border:1px dashed var(--line);border-radius:8px;background:#fffffe;color:#171a22;overflow:auto;font-size:26px}
.syms{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.syms button{border:1px solid var(--line);background:none;border-radius:6px;min-width:38px;height:34px;padding:0 8px}
.syms button:hover{background:var(--hover)}
.frow{display:flex;gap:8px;align-items:center;margin:8px 0}
.frow input[type=text]{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.radio{display:block;padding:8px 4px}
.radio input{margin-right:8px}

#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;margin-left:8px;padding:0}


#tpl{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:hidden;border-radius:3px}
#tpl svg{display:block}
#sheet[data-bg=seyes]{--lh:calc(34.2857 * var(--s) * 1px);--pt:calc(68.5714 * var(--s) * 1px)}
#sheet[data-bg=seyes] #text{padding-left:calc(150 * var(--s) * 1px)}
#sheet[data-bg=course],#sheet[data-bg=cornell]{--pt:calc(110 * var(--s) * 1px)}
#sheet[data-bg=course] #text{padding-left:calc(130 * var(--s) * 1px)}
#sheet[data-bg=cornell] #text{padding-left:calc(272 * var(--s) * 1px)}
#text u{text-decoration:underline}
#text a{color:#1f3fbf;text-decoration:underline}
#text a.wl{color:#6a2fc0;text-decoration:none;border-bottom:1.5px dotted currentColor;cursor:pointer}
#text a.wl.dead{color:#c62f3a;border-bottom-style:dashed}
#text code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:#eef1f8;border-radius:.25em;padding:.05em .3em}
#text .s-n{font-size:calc(var(--f) * var(--s) * 1px)}
#text .s-sm{font-size:calc(var(--f) * .8 * var(--s) * 1px)}
#text .s-lg{font-size:calc(var(--f) * 1.35 * var(--s) * 1px)}
#text .s-xl{font-size:calc(var(--f) * 1.8 * var(--s) * 1px)}
#text table.tb{border-collapse:collapse;width:100%;table-layout:fixed;margin:0}
#text table.tb td,#text table.tb th{border:1px solid #b7c0d6;padding:0 .4em;vertical-align:top;word-break:break-word;min-width:2em;height:var(--lh);font-weight:400;text-align:inherit}
#pop{min-width:0;padding:8px;max-width:calc(100vw - 16px)}
#pop .pw{display:flex;flex-wrap:wrap;gap:6px;max-width:260px}
#pop .sw{margin:0;border:1px solid var(--line)}
#pop .mi{white-space:nowrap}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:6px 0}
.tplcard{border:2px solid var(--line);border-radius:10px;background:none;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.tplcard svg{width:100%;height:auto;border:1px solid var(--line);background:#fff;display:block}
.tplcard[aria-pressed=true]{border-color:var(--acc);background:var(--hover)}
.vrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.vthumb{width:96px;height:128px;border:1px solid var(--line);border-radius:6px;background:#fffffe;flex:none}
.vinfo{flex:1;min-width:0}
.vt{font-weight:600}
.vs,.vx{color:var(--mute);font-size:13px}
.vx{margin:4px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.num{width:80px!important}

#refbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute);flex:none}
#refbar[hidden]{display:none}
.chip.sm{padding:2px 10px;font-size:12px}
.pick{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:50vh;overflow:auto}
.pickrow{text-align:left}
#pane{display:none;flex-direction:column;border-left:1px solid var(--line);min-width:0;min-height:0;background:var(--panel)}
.pane-h{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.pane-h .sp{flex:1}
#paneF{flex:1;border:0;width:100%;min-height:0;background:var(--bg)}
body.split #app{grid-template-columns:260px 1fr 1fr}
body.split #pane{display:flex}
body.focus #app{grid-template-columns:1fr}
body.focus.split #app{grid-template-columns:1fr 1fr}
body.focus #side{display:none}
body.pane #focusBtn{display:none}
body.pane #app{grid-template-columns:1fr}
body.pane #side,body.pane .only-mobile{display:none!important}
body.pane #main{display:flex!important}
@media (max-width:999px){body.split #pane{display:none}body.split #app{grid-template-columns:300px 1fr}}
@media (max-width:760px),(max-height:520px){
  .hide-narrow{display:none}
  #app{grid-template-columns:1fr}
  body.view-list #main{display:none}
  body.view-edit #side{display:none}
  .only-mobile{display:inline-flex}
  #scroller{padding:10px 8px 80px}
  .bar{gap:4px;padding-left:6px;padding-right:6px}
}
@media print{
  html,body{height:auto;background:#fff}
  #app{display:block;height:auto}
  #pane,#refbar,#side,.bar,.tools,.menu,#toast,#noNote,#zoomPill,#selbar,.oc,.rh{display:none!important}
  body.view-list #main{display:block}
  #main,#editor{display:block}
  #scroller{overflow:visible;padding:0}
  #sheet{box-shadow:none;width:100%!important}
}
</style>
</head>
<body class="view-list" data-mode="text">
<div id="app">
  <aside id="side">
    <div class="side-top">
      <h1>MattNotes</h1>
      <div class="side-actions">
        <button id="gmenuBtn" class="ib" aria-label="Menu général" aria-haspopup="true"></button>
        <button id="newBtn" class="primary">Nouvelle note</button>
      </div>
    </div>
    <input id="search" type="search" placeholder="Rechercher une note" aria-label="Rechercher une note">
    <div id="chips" class="chips" role="group" aria-label="Dossiers"></div>
    <div id="syncInfo" class="syncinfo" hidden></div>
    <ul id="list"></ul>
  </aside>

  <main id="main">
    <div id="noNote" class="placeholder">Crée ou ouvre une note pour commencer.</div>
    <section id="editor" hidden>
      <header class="bar">
        <button id="backBtn" class="ib only-mobile" aria-label="Retour à la liste"></button>
        <input id="title" placeholder="Sans titre" aria-label="Titre de la note" maxlength="200">
        <div class="seg" role="group" aria-label="Mode">
          <button id="modeText" aria-pressed="true">Texte</button>
          <button id="modeDraw" aria-pressed="false">Dessin</button>
        </div>
        <button id="focusBtn" class="ib hide-narrow" aria-label="Plein écran (Ctrl+Maj+F)" title="Plein écran (Ctrl+Maj+F)" aria-pressed="false"></button>
        <button id="menuBtn" class="ib" aria-label="Menu de la note" aria-haspopup="true"></button>
      </header>

      <div class="tools" id="toolsText">
        <button class="ib u" aria-label="Annuler"></button>
        <button class="ib r" aria-label="Rétablir"></button>
        <span class="sep"></span>
        <button class="ib t" data-cmd="bold" aria-label="Gras"><b>G</b></button>
        <button class="ib t" data-cmd="italic" aria-label="Italique"><i>I</i></button>
        <button class="ib t" data-cmd="strikeThrough" aria-label="Barré"><s>S</s></button>
        <button class="ib t" data-cmd="underline" aria-label="Souligné"><u>U</u></button>
        <button class="ib t" data-cmd="h2" aria-label="Titre de section"><b>T</b></button>
        <button class="ib t" data-cmd="insertUnorderedList" aria-label="Liste à puces">•</button>
        <button class="ib t" data-cmd="insertOrderedList" aria-label="Liste numérotée">1.</button>
        <button class="ib" id="chkBtn" aria-label="Liste de tâches à cocher"></button>
        <span class="sep"></span>
        <button class="ib" id="colBtn" aria-label="Couleur du texte"></button>
        <button class="ib" id="hiBtn" aria-label="Surligner"></button>
        <button class="ib t" id="sizeBtn" aria-label="Taille du texte sélectionné">Aa</button>
        <button class="ib" id="alignBtn" aria-label="Alignement du paragraphe"></button>
        <button class="ib" id="linkBtn" aria-label="Lien"></button>
        <button class="ib t" id="nlBtn" aria-label="Lien vers une note">[[ ]]</button>
        <button class="ib" id="tblBtn" aria-label="Tableau"></button>
        <button class="ib t" id="codeBtn" aria-label="Code"><code>&lt;/&gt;</code></button>

<script>
'use strict';
const W = 900;                       // largeur logique de la page (traits et objets sont stockés dans cette unité)
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const IC = {
  back:'<path d="M15 5l-7 7 7 7"/>',

  pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19z"/><path d="M14.5 6.5l3 3"/>',

  lasso:'<ellipse class="nf" cx="12" cy="9" rx="8" ry="5.2" stroke-dasharray="2.6 2.6"/><path d="M9.5 13.8c-1.4 2.2-1.2 3.7.6 4.6 1.5.8 2.6 1.6 2.4 3"/>',
  line:'<path d="M5 19L19 5"/>',
  rect:'<rect class="nf" x="4.5" y="6.5" width="15" height="11" rx="1.5"/>',
  ellipse:'<ellipse class="nf" cx="12" cy="12" rx="8" ry="6"/>',
  arrow:'<path d="M5 19L19 5"/><path d="M10 5h9v9"/>',
  menu:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  hand:'<path d="M9 11V5.5a1.5 1.5 0 013 0V11"/><path d="M12 10a1.5 1.5 0 013 0v2a1.5 1.5 0 013 0v4a6 6 0 01-6 6h-1a5 5 0 01-4-2l-3-4.5a1.5 1.5 0 012.3-1.9L9 15"/>',
  image:'<rect class="nf" x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/>',
  sigma:'<path d="M18 5H6l6 7-6 7h12"/>',
  check:'<rect class="nf" x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',
  dup:'<rect class="nf" x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const svg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
$('#backBtn').innerHTML = svg('back');
$('#menuBtn').innerHTML = svg('menu');
$('#gmenuBtn').innerHTML = svg('menu');

$('#imgBtn').innerHTML = svg('image');
$('#eqBtn').innerHTML = svg('sigma');

$$('.r').forEach(b => b.innerHTML = svg('redo'));

/* ---------- réglages ---------- */
const PALETTE = [['#171a22','Noir'],['#1f3fbf','Bleu'],['#c62f3a','Rouge'],['#14804a','Vert'],['#e2761b','Orange'],['#7a3fc0','Violet'],['#f5d800','Jaune']];
const TOOLS = ['pen','hl','eraser','lasso','line','rect','ellipse','arrow'];
const SHAPES = ['line','rect','ellipse','arrow'];
let set = {tool:'pen', cp:'#171a22', ch:'#f5d800', size:3, finger:'auto', last:''};
try { Object.assign(set, JSON.parse(localStorage.getItem('mattnotes.set') || '{}')); } catch (e) {}
if (!TOOLS.includes(set.tool)) set.tool = 'pen';
const IS_PANE = /[?&]pane=/.test(location.search);      // 2e éditeur affiché à côté (vue scindée)
if (IS_PANE) document.body.classList.add('pane');
const saveSet = () => { if (IS_PANE) return; try { localStorage.setItem('mattnotes.set', JSON.stringify(set)); } catch (e) {} };

/* ---------- stockage IndexedDB ---------- */
let db = null;
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('mattnotes', 3);
  r.onupgradeneeded = () => {
    const d = r.result;
    if (!d.objectStoreNames.contains('notes')) d.createObjectStore('notes', {keyPath:'id'});
    if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', {keyPath:'id'});
    if (!d.objectStoreNames.contains('versions')) d.createObjectStore('versions', {keyPath:'id'}).createIndex('nid', 'nid');
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const store = (n, m) => db.transaction(n, m).objectStore(n);
const idb = q => new Promise((res, rej) => { q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbAll = () => idb(store('notes', 'readonly').getAll());
const dbPut = n => idb(store('notes', 'readwrite').put(n));
const fPut = (id, blob) => idb(store('files', 'readwrite').put({id, blob}));
const fGet = id => idb(store('files', 'readonly').get(id)).then(r => r ? r.blob : null);
const fDel = id => idb(store('files', 'readwrite').delete(id));
const fHas = id => idb(store('files', 'readonly').count(id)).then(c => c > 0);
const furl = {};                                   // id de fichier -> URL objet
async function fileURL(id){
  if (furl[id]) return furl[id];
  const b = db ? await fGet(id) : null;
  if (!b) return null;
  return furl[id] = URL.createObjectURL(b);
}
async function addFile(blob){
  const id = uid(); await fPut(id, blob); furl[id] = URL.createObjectURL(blob); return id;
}
const noteFileIds = n => [...(n.bgs || []).map(b => b.fid), ...(n.objs || []).filter(o => o.k === 'img').map(o => o.fid)];
async function loadNoteFiles(n){ await Promise.all(noteFileIds(n).map(id => fileURL(id).catch(() => null))); }

/* ---------- état ---------- */
let notes = [], cur = null, mode = 'text', saveT = 0;
let ustack = [], rstack = [], live = null, active = null, scrolling = null, erasing = null, penSeen = false, raf = 0;
let lastEdit = 'text';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const newNote = () => ({id:uid(), title:'', html:'', text:'', strokes:[], objs:[], bgs:[], bg:'lines', h:1400,
  fs:(Math.min(innerWidth, innerHeight) < 600 ? 40 : 30), pin:false, folder:'', deleted:0, purged:false, created:Date.now(), updated:Date.now()});
const text = $('#text'), sheet = $('#sheet'), cvs = $('#ink'), ctx = cvs.getContext('2d'), scroller = $('#scroller');
const lv = $('#live'), lctx = lv.getContext('2d');
let ls = {n:0}, dirtyInk = false;
const num = (v, d, lo, hi) => { v = +v; return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
const r1 = v => Math.round(v * 10) / 10;

let tt = 0;
function toast(m, act){
  const t = $('#toast'); t.textContent = m;
  if (act){
    const b = document.createElement('button'); b.textContent = act.label;
    b.onclick = () => { t.classList.remove('show'); act.fn(); };
    t.append(b);
  }
  t.classList.toggle('act', !!act); t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), act ? 6000 : 3000);
}

function saveNote(n){
  if (db) dbPut(n).then(() => { bcSend(n.id); if (window.scheduleSync) scheduleSync(); }).catch(() => toast('Échec de l’enregistrement sur cet appareil.'));
  if (db && !n.purged && !n.deleted) snapshot(n, '', 10 * 60e3);
}
function commit(){ if (cur){ clearTimeout(saveT); saveNote(cur); } }
function changed(){ if (!cur) return; cur.updated = Date.now(); clearTimeout(saveT); saveT = setTimeout(() => { saveNote(cur); renderList(); renderRefs(); }, 400); }
document.addEventListener('visibilitychange', () => { if (document.hidden) commit(); });
addEventListener('pagehide', commit);

/* ---------- boîte de dialogue ---------- */
const dlg = $('#dlg');
function modal(title, build, actions){
  dlg.textContent = '';
  const h = document.createElement('div'); h.className = 'dlg-h'; h.textContent = title;
  const b = document.createElement('div'); b.className = 'dlg-b';
  const f = document.createElement('div'); f.className = 'dlg-f';
  dlg.append(h, b, f);
  build(b);
  (actions || [{label:'Fermer'}]).forEach(a => {
    const x = document.createElement('button');
    x.className = a.primary ? 'primary' : a.danger ? 'btn danger' : 'btn';
    x.textContent = a.label;
    x.onclick = async () => { if (a.fn){ const keep = await a.fn(); if (keep === false) return; } dlg.close(); };
    f.append(x);
  });
  if (!dlg.open) dlg.showModal();
}

/* ---------- HTML sûr ---------- */
const OK = new Set(['B','STRONG','I','EM','U','S','STRIKE','H2','UL','OL','LI','DIV','P','BR','SPAN','A','CODE','TABLE','TBODY','THEAD','TR','TD','TH']);
const DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','SVG','MATH','TEMPLATE']);
const COLOR_RE = /^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*[\d.]+\s*)?\)|transparent|[a-z]{3,20})$/i;
function cleanStyle(str){
  const out = [];
  String(str).split(';').forEach(d => {
    const i = d.indexOf(':'); if (i < 0) return;
    const p = d.slice(0, i).trim().toLowerCase(), v = d.slice(i + 1).trim();
    if ((p === 'color' || p === 'background-color') && COLOR_RE.test(v)) out.push(p + ': ' + v);
    else if (p === 'text-align' && /^(left|center|right|justify)$/i.test(v)) out.push(p + ': ' + v.toLowerCase());
  });
  return out.join('; ');
}
function sanitize(html){
  const t = document.createElement('template'); t.innerHTML = String(html || '');
  (function walk(n){
    [...n.childNodes].forEach(c => {
      if (c.nodeType === 1){
        walk(c);
        if (!OK.has(c.tagName)){
          if (DROP.has(c.tagName.toUpperCase())) c.remove(); else c.replaceWith(...c.childNodes);
        } else {
          const cls = c.getAttribute('class') || '', st = c.getAttribute('style') || '', href = c.getAttribute('href') || '', dn = c.getAttribute('data-n') || '';
          [...c.attributes].forEach(a => c.removeAttribute(a.name));
          if (c.tagName === 'DIV' && /^chk( done)?$/.test(cls)) c.className = cls;
          else if (c.tagName === 'SPAN' && cls === 'cb') c.className = 'cb';
          else if (c.tagName === 'SPAN' && /^s-(n|sm|lg|xl)$/.test(cls)) c.className = cls;
          else if (c.tagName === 'TABLE' && cls === 'tb') c.className = 'tb';
          const cs = cleanStyle(st); if (cs) c.setAttribute('style', cs);
          if (c.tagName === 'A'){
            if (/^wl( dead)?$/.test(cls) && /^[\w-]{1,40}$/.test(dn)){ c.className = 'wl'; c.setAttribute('data-n', dn); }
            else if (/^(https?:|mailto:|tel:)/i.test(href.trim())){ c.setAttribute('href', href.trim()); c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener noreferrer'); }
            else c.replaceWith(...c.childNodes);
          }
        }
      } else if (c.nodeType !== 3) c.remove();
    });
  })(t.content);
  return t.innerHTML;
}

/* ---------- nettoyage d'une note importée ---------- */
function cleanNote(n){
  const html = sanitize(n.html), tmp = document.createElement('div'); tmp.innerHTML = html;
  const strokes = (Array.isArray(n.strokes) ? n.strokes : []).map(s => {
    const o = {
      t:['hl', 'line', 'rect', 'ellipse', 'arrow'].includes(s.t) ? s.t : 'pen',
      c:/^#[0-9a-f]{6}$/i.test(s.c) ? s.c : '#171a22',
      w:num(s.w, 3, 1, 48),
      pts:(Array.isArray(s.pts) ? s.pts : []).filter(p => Array.isArray(p) && Number.isFinite(+p[0]) && Number.isFinite(+p[1])).map(p => [+p[0], +p[1], p[2] == null ? .5 : num(p[2], .5, 0, 1)])
    };
    return o;
  }).filter(s => s.pts.length);
  const id = x => String(x || uid()).replace(/[^\w-]/g, '').slice(0, 40) || uid();
  const objs = (Array.isArray(n.objs) ? n.objs : []).map(o => {
    if (!o || typeof o !== 'object') return null;
    if (o.k === 'img') return {id:id(o.id), k:'img', fid:id(o.fid), x:num(o.x, 0, -2000, 4000), y:num(o.y, 0, -2000, 80000), w:num(o.w, 300, 20, 4000), h:num(o.h, 200, 20, 6000)};
    if (o.k === 'eq') return {id:id(o.id), k:'eq', tex:String(o.tex || '').slice(0, 2000), x:num(o.x, 0, -2000, 4000), y:num(o.y, 0, -2000, 80000), f:num(o.f, 34, 10, 300)};
    return null;
  }).filter(Boolean);
  const bgs = (Array.isArray(n.bgs) ? n.bgs : []).map(b => b && typeof b === 'object' ? {fid:id(b.fid), y:num(b.y, 0, 0, 80000), h:num(b.h, 1200, 20, 20000)} : null).filter(Boolean);
  return {id:id(n.id), title:String(n.title || '').slice(0, 200), html, text:tmp.textContent,
    strokes, objs, bgs, bg:['lines', 'grid', 'dots', 'blank', 'seyes', 'axes', 'cornell', 'course'].includes(n.bg) ? n.bg : 'lines', h:num(n.h, 1400, 600, 80000), fs:num(n.fs, 18, 14, 64),
    pin:!!n.pin, folder:String(n.folder || '').slice(0, 60), deleted:num(n.deleted, 0, 0, 9e15), purged:!!n.purged,
    created:num(n.created, Date.now(), 0, 9e15), updated:num(n.updated, Date.now(), 0, 9e15)};
}

/* ---------- liste, dossiers, corbeille ---------- */
let view = 'all';                                  // 'all' | 'trash' | 'f:<dossier>'
const DAY = 864e5;
const fmt = ts => {
  const d = new Date(ts), n = new Date();
  return d.toDateString() === n.toDateString() ? d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
};
function folderNames(){
  const s = new Set(set.folders || []);
  notes.forEach(n => { if (!n.purged && !n.deleted && n.folder) s.add(n.folder); });
  return [...s].sort((a, b) => a.localeCompare(b, 'fr'));
}
function renderChips(){
  if (view.startsWith('f:') && !folderNames().includes(view.slice(2))) view = 'all';
  if (view.startsWith('t:') && !tagList().some(x => x[0] === view.slice(2))) view = 'all';
  tagSig = tagList().join('|');
  const box = $('#chips'); box.textContent = '';
  const add = (id, label) => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = label;
    b.setAttribute('aria-pressed', view === id);
    b.onclick = () => { view = id; renderChips(); renderList(); };
    box.append(b);
  };
  add('all', 'Toutes');
  folderNames().forEach(f => add('f:' + f, f));
  tagList().slice(0, 40).forEach(x => add('t:' + x[0], '#' + x[0]));
  const tc = notes.filter(n => !n.purged && n.deleted).length;
  add('trash', tc ? 'Corbeille (' + tc + ')' : 'Corbeille');
}
function renderList(){
  const q = $('#search').value.trim().toLowerCase(), ul = $('#list');
  ul.textContent = '';
  const trash = view === 'trash';
  let items = notes.filter(n => !n.purged && (trash ? n.deleted : !n.deleted));
  if (view.startsWith('f:')) items = items.filter(n => n.folder === view.slice(2));
  if (view.startsWith('t:')) items = items.filter(n => tagsOf(n).includes(view.slice(2)));
  if (q) items = items.filter(n => (n.title + ' ' + n.text).toLowerCase().includes(q));
  items.sort((a, b) => trash ? b.deleted - a.deleted : (b.pin - a.pin) || (b.updated - a.updated));
  if (!items.length){
    const li = document.createElement('li'); li.className = 'none';
    li.textContent = q ? 'Aucune note ne correspond.' : trash ? 'La corbeille est vide.' : 'Aucune note ici pour l’instant.';
    ul.append(li); return;
  }
  items.forEach(n => {
    const li = document.createElement('li');
    const title = (n.pin && !trash ? '★ ' : '') + (n.title || 'Sans titre');
    const sub = (n.text || '').trim().replace(/\s+/g, ' ').slice(0, 90) || (n.strokes.length || n.bgs.length ? 'Note manuscrite' : 'Note vide');
    if (trash){
      li.className = 'trow';
      const t = document.createElement('div'); t.className = 'li-t'; const a = document.createElement('span'); a.textContent = title; t.append(a);
      const s = document.createElement('div'); s.className = 'li-s';
      const left = Math.max(1, 30 - Math.floor((Date.now() - n.deleted) / DAY));
      s.textContent = 'Suppression définitive dans ' + left + ' j';
      const acts = document.createElement('div'); acts.className = 'acts';
      const r = document.createElement('button'); r.className = 'btn'; r.textContent = 'Restaurer'; r.onclick = () => restoreNote(n);
      const d = document.createElement('button'); d.className = 'btn danger'; d.textContent = 'Supprimer définitivement';
      d.onclick = () => { if (confirm('Supprimer définitivement cette note ?')){ purgeNote(n); renderChips(); renderList(); } };
      acts.append(r, d); li.append(t, s, acts); ul.append(li); return;
    }
    const b = document.createElement('button'); b.className = 'item' + (cur && cur.id === n.id ? ' on' : ''); b.dataset.id = n.id;
    const t = document.createElement('div'); t.className = 'li-t';
    const a = document.createElement('span'); a.textContent = title;
    const d = document.createElement('time'); d.textContent = fmt(n.updated);
    t.append(a, d);
    const s = document.createElement('div'); s.className = 'li-s'; s.textContent = (n.folder ? '📁 ' + n.folder + ' · ' : '') + sub;
    b.append(t, s); li.append(b); ul.append(li);
  });
}

}

function decodeImage(blob){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Image illisible')); };
    im.src = u;
  });
}
const toBlob = (c, type, q) => new Promise(res => c.toBlob(res, type, q));
async function shrinkImage(file, max){
  const im = await decodeImage(file);
  const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  let blob = null;
  if (file.type === 'image/png' || file.type === 'image/webp' || file.type === 'image/gif'){
    g.drawImage(im, 0, 0, w, h); blob = await toBlob(c, 'image/png');
    if (blob && blob.size > 1.5e6) blob = null;
  }
  if (!blob){ g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h); blob = await toBlob(c, 'image/jpeg', .86); }
  c.width = 0;
  return {blob, w, h};
}

function blobToB64(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });

  return new Blob([u], {type:type || 'application/octet-stream'});
}
function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function buildPdf(pages){
  const enc = new TextEncoder(), parts = [], offs = []; let off = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); off += b.length; };

  push('%PDF-1.4\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push('<< /Type /Pages /Count ' + n + ' /Kids [' + pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] >>'));
  pages.forEach((p, i) => {
    const po = 3 + 3 * i, co = po + 1, io = po + 2;
    obj(po, () => push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + p.pw + ' ' + p.ph + '] /Resources << /XObject << /Im0 ' + io + ' 0 R >> >> /Contents ' + co + ' 0 R >>'));
    const cs = 'q ' + p.pw + ' 0 0 ' + p.ph + ' 0 0 cm /Im0 Do Q';
    obj(co, () => push('<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream'));
    obj(io, () => { push('<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.jpeg.length + ' >>\nstream\n'); push(p.jpeg); push('\nendstream'); });
  });
  const xref = off;
  push('xref\n0 ' + total + '\n0000000000 65535 f \n');
  for (let i = 1; i < total; i++) push(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  push('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(parts, {type:'application/pdf'});
}
$('#expPdf').onclick = async () => {

  try {
    toast('Création du PDF…');
    const {canvas, px, endUnits} = await renderPage();
    const A4 = W * 1.4142, cuts = [];
    let y = 0;
    [...cur.bgs].sort((a, b) => a.y - b.y).forEach(b => {
      if (b.y > y + 40) for (let t = y; t < b.y; t += A4) cuts.push([t, Math.min(b.y, t + A4)]);
      cuts.push([b.y, b.y + b.h]); y = b.y + b.h;
    });
    for (let t = y; t < endUnits - 20 || (!cuts.length && t === 0); t += A4) cuts.push([t, Math.min(Math.max(endUnits, A4), t + A4)]);
    const pages = [];
    for (const [a, b] of cuts){
      const part = cropCanvas(canvas, a * px, Math.min(canvas.height, b * px));
      const jb = await toBlob(part, 'image/jpeg', .9);
      pages.push({jpeg:new Uint8Array(await jb.arrayBuffer()), w:part.width, h:part.height, pw:595, ph:Math.max(50, Math.round(595 * part.height / part.width))});
      part.width = 0;
    }
    canvas.width = 0;
    saveBlob(buildPdf(pages), exportName('.pdf')); toast('PDF téléchargé.');
  } catch (e) { toast('Export impossible. Essaie « Imprimer » à la place.'); }
};

/* ---------- synchronisation entre appareils (dépôt GitHub privé) ---------- */
const SYNC_KEY = 'mattnotes.sync';
const syncCfg = () => { if (IS_PANE) return null; try { const c = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); return c && c.owner && c.repo && c.token ? c : null; } catch (e) { return null; } };
const saveCfg = c => { try { if (c) localStorage.setItem(SYNC_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); } catch (e) {} };
let syncing = false, syncAgain = false, syncT = 0;
const RAW = {Accept:'application/vnd.github.raw+json'};
class SyncError extends Error {}

function setSyncInfo(msg, err){
  const el = $('#syncInfo');
  if (!syncCfg()){ el.hidden = true; return; }
  el.hidden = false; el.textContent = msg; el.classList.toggle('err', !!err); el.title = 'Toucher pour synchroniser maintenant';
}
function scheduleSync(){
  if (!syncCfg()) return;
  clearTimeout(syncT); syncT = setTimeout(() => runSync(false), 6000);
}
function gh(path, opt){
  const c = syncCfg(); opt = opt || {};
  return fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + path, {
    ...opt, cache:'no-store',
    headers:{Authorization:'Bearer ' + c.token, 'X-GitHub-Api-Version':'2022-11-28', Accept:'application/vnd.github+json', ...(opt.headers || {})}
  });
}
function checkStatus(r, what){
  if (r.ok) return;
  if (r.status === 401) throw new SyncError('Jeton GitHub invalide ou expiré.');
  if (r.status === 403 || r.status === 429) throw new SyncError('GitHub refuse l’accès (droits du jeton ou limite atteinte).');
  if (r.status === 404) throw new SyncError('Dépôt introuvable : vérifie le nom et les droits du jeton.');
  throw new SyncError('Erreur GitHub (' + r.status + ') pendant : ' + what);
}
async function ghPut(path, blob, sha){
  const body = {message:'MattNotes sync', content:await blobToB64(blob)};
  if (sha) body.sha = sha;
  const r = await gh('/contents/' + path, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (r.status === 409 || r.status === 422) return 'conflict';
  checkStatus(r, 'envoi de ' + path);
  const j = await r.json(); return j && j.content ? j.content.sha : 'ok';
}
async function syncOnce(){
  const c = syncCfg(), tree = new Map();
  const tr = await gh('/git/trees/' + encodeURIComponent(c.branch || 'HEAD') + '?recursive=1');
  if (tr.status === 200){ const j = await tr.json(); (j.tree || []).forEach(t => { if (t.type === 'blob') tree.set(t.path, t.sha); }); }
  else if (tr.status !== 409) checkStatus(tr, 'lecture du dépôt');       // 409 = dépôt vide
  let idx = {};
  if (tree.has('index.json')){
    const r = await gh('/contents/index.json', {headers:RAW}); checkStatus(r, 'lecture de l’index');
    const j = await r.json(); idx = (j && j.notes) || {};
  }
  const remoteNew = Object.keys(idx).filter(id => { const l = notes.find(n => n.id === id); return !l || idx[id] > l.updated; });
  const localNew = notes.filter(n => idx[n.id] === undefined || n.updated > idx[n.id]);

  for (const id of remoteNew){
    if (!/^[\w-]+$/.test(id)) continue;
    const r = await gh('/contents/notes/' + id + '.json', {headers:RAW}); if (!r.ok) continue;
    const n = cleanNote(await r.json());
    for (const fid of noteFileIds(n)){
      if (db && !(await fHas(fid)) && tree.has('files/' + fid)){
        const fr = await gh('/contents/files/' + fid, {headers:RAW});
        if (fr.ok) await fPut(fid, await fr.blob());
      }
    }
    await applyRemote(n);
  }
  let pushed = 0;
  for (const n of localNew){
    for (const fid of noteFileIds(n)){
      const p = 'files/' + fid;
      if (!tree.has(p)){
        const b = db ? await fGet(fid) : null;
        if (b){ const s = await ghPut(p, b); if (s === 'conflict') return false; tree.set(p, s); }
      }
    }
    const p = 'notes/' + n.id + '.json';
    const s = await ghPut(p, new Blob([JSON.stringify(n)], {type:'application/json'}), tree.get(p));
    if (s === 'conflict') return false;
    idx[n.id] = n.updated; pushed++;
  }
  if (pushed){
    const s = await ghPut('index.json', new Blob([JSON.stringify({v:1, notes:idx})], {type:'application/json'}), tree.get('index.json'));
    if (s === 'conflict') return false;
  }
  return true;
}
async function applyRemote(n){
  const i = notes.findIndex(x => x.id === n.id);
  if (i >= 0 && !n.purged) await snapshot(notes[i], 'Avant synchronisation', 0);
  if (i >= 0) notes[i] = n; else notes.push(n);
  if (db){ await dbPut(n); bcSend(n.id); }
  if (cur && cur.id === n.id){
    if (n.deleted || n.purged) closeEditor(); else openNote(n.id);
  }
  renderChips(); renderList();
}
async function runSync(manual){
  const c = syncCfg(); if (!c) return;
  if (!navigator.onLine){ setSyncInfo('Hors ligne — synchronisation en attente', true); if (manual) toast('Hors ligne.'); return; }
  if (syncing){ syncAgain = true; return; }
  syncing = true; setSyncInfo('Synchronisation…');
  try {
    commit();
    let ok = false;
    for (let i = 0; i < 3 && !ok; i++) ok = await syncOnce();
    if (!ok) throw new SyncError('Conflit avec un autre appareil, réessaie dans un instant.');
    setSyncInfo('Synchronisé à ' + new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}));
    if (manual) toast('Synchronisation terminée.');
  } catch (e) {
    const msg = e instanceof SyncError ? e.message : 'Synchronisation impossible (réseau ?).';
    setSyncInfo(msg, true); if (manual) toast(msg);
  } finally {
    syncing = false;
    if (syncAgain){ syncAgain = false; scheduleSync(); }
  }
}
$('#syncInfo').onclick = () => runSync(true);
$('#gSync').onclick = () => { closeMenus(); if (!syncCfg()) syncDialog(); else runSync(true); };
$('#gSyncCfg').onclick = () => { closeMenus(); syncDialog(); };
addEventListener('online', scheduleSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(); });

    b.append(h);

}

        '<g transform="translate(0,40)"><rect width="900" height="' + H + '" fill="url(#' + p + 'd)"/></g>';

        '<path d="M0 ' + m + 'H' + SY + 'M0 ' + 2 * m + 'H' + SY + 'M0 ' + 3 * m + 'H' + SY + '" stroke="#e8def3" stroke-width=".9" fill="none"/>' +

        '<path d="M' + 4 * SY + ' 0V' + H + '" stroke="#e56b6f" stroke-width="1.6" fill="none"/>';
    }
    case 'axes': {
      const A = 1260;
      return '<defs>' +
        '<pattern id="' + p + 'a" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#dfe5f2" stroke-width="1"/></pattern>' +
        '<pattern id="' + p + 'b" width="150" height="150" patternUnits="userSpaceOnUse"><path d="M150 0H0V150" fill="none" stroke="#c3cde8" stroke-width="1.4"/></pattern>' +
        '<pattern id="' + p + 'c" width="900" height="' + A + '" patternUnits="userSpaceOnUse">' +
        '<g stroke="#3a4560" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M30 630H870M860 624L870 630L860 636"/><path d="M450 1230V30M444 40L450 30L456 40"/></g>' +
        '<g font-family="system-ui,sans-serif" font-size="16" font-style="italic" fill="#3a4560"><text x="874" y="622">x</text><text x="460" y="44">y</text><text x="434" y="650">O</text></g>' +
        '</pattern></defs>' +
        '<rect width="900" height="' + H + '" fill="url(#' + p + 'a)"/><rect width="900" height="' + H + '" fill="url(#' + p + 'b)"/><rect width="900" height="' + H + '" fill="url(#' + p + 'c)"/>';
    }
    case 'cornell':
      return ruled(250, 650) + box(24, 20, 852, 66) + '<path d="M620 20V86" stroke="#c5cde3" stroke-width="1.5"/>' + T(40, 42, 'Sujet') + T(636, 42, 'Date') +

text.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;

/* raccourcis Markdown pendant la frappe (manipulation directe du DOM, sans execCommand) */
const INLINE_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'SPAN', 'A', 'CODE', 'FONT']);
const isInlineNode = n => n.nodeType === 3 || (n.nodeType === 1 && INLINE_TAGS.has(n.tagName));
function caretAt(node, off){ const r = document.createRange(); r.setStart(node, off); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function firstLeaf(el){ let n = el; while (n.firstChild && n.firstChild.nodeType === 1 && n.firstChild.tagName !== 'BR') n = n.firstChild; return n; }
/* renvoie le <div> qui contient le curseur ; enveloppe d'abord les lignes « nues » posées directement dans l'éditeur */
function lineDiv(node, off){
  let top = node; while (top && top.parentNode !== text){ if (!top.parentNode) return null; top = top.parentNode; }
  if (!top) return null;
  if (top.nodeType === 1 && !isInlineNode(top) && top.tagName !== 'BR') return top.tagName === 'DIV' ? top : null;
  let first = top, last = top;
  while (first.previousSibling && isInlineNode(first.previousSibling)) first = first.previousSibling;
  while (last.nextSibling && isInlineNode(last.nextSibling)) last = last.nextSibling;
  const div = document.createElement('div'); first.before(div);
  for (let n = first; n; ){ const nx = n === last ? null : n.nextSibling; div.append(n); n = nx; }
  if (node.nodeType === 3) caretAt(node, off); else caretAt(node, off);
  return div;
}
function tryBlockShortcut(){
  const s = getSelection(); if (!s.rangeCount || !s.isCollapsed || !s.anchorNode || !text.contains(s.anchorNode)) return;
  const node = s.anchorNode, off = s.anchorOffset;
  const div = lineDiv(node, off); if (!div || div.classList.contains('chk')) return;
  const sel2 = getSelection(); if (!sel2.rangeCount) return;
  const rg = document.createRange(); rg.selectNodeContents(div); rg.setEnd(sel2.anchorNode, sel2.anchorOffset);
  const t = rg.toString().replace(/ /g, ' ');
  let act = null;
  if (/^#{1,3} $/.test(t)) act = 'h2';
  else if (/^[-*•] $/.test(t)) act = 'ul';
  else if (/^\d+[.)] $/.test(t)) act = 'ol';
  else if (/^\[ ?\] $/.test(t)) act = 'chk';
  else if (/^\[[xX]\] $/.test(t)) act = 'chkd';
  if (!act){ return; }
  rg.deleteContents();
  const moveInto = tag => {
    const el = document.createElement(tag);
    while (div.firstChild){ const c = div.firstChild; if (c.nodeType === 3 && !c.nodeValue) c.remove(); else el.append(c); }
    if (!el.firstChild) el.append(document.createElement('br'));
    return el;
  };
  let target;
  if (act === 'h2'){ target = moveInto('h2'); div.replaceWith(target); }
  else if (act === 'ul' || act === 'ol'){
    const li = moveInto('li'), list = document.createElement(act); list.append(li); div.replaceWith(list); target = li;
  } else {
    div.classList.add('chk'); if (act === 'chkd') div.classList.add('done');
    [...div.childNodes].forEach(c => { if (c.nodeType === 3 && !c.nodeValue) c.remove(); });
    if (!div.firstChild) div.append(document.createElement('br'));
    div.prepend(mkCb()); target = div;
  }
  const tn = (function f(n){ for (const c of n.childNodes){ if (c.nodeType === 3 && c.nodeValue) return c; if (c.nodeType === 1 && !c.classList.contains('cb')){ const r = f(c); if (r) return r; } } return null; })(target);
  if (tn) caretAt(tn, 0);
  else { const br = target.querySelector('br'); br ? caretAt(br.parentNode, [...br.parentNode.childNodes].indexOf(br)) : caretAt(target, target.childNodes.length); }
}
function tryInline(ch){
  const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return;
  const node = s.anchorNode; if (!node || node.nodeType !== 3 || (node.parentElement && node.parentElement.closest('code'))) return;
  const off = s.anchorOffset, t = node.nodeValue.slice(0, off);
  let m, tag, start, inner;
  if (ch === '`'){ m = /`([^`]+)`$/.exec(t); if (m){ tag = 'code'; start = m.index; inner = m[1]; } }
  else {
    m = /\*\*([^*\s](?:[^*]*[^*\s])?)\*\*$/.exec(t);
    if (m){ tag = 'b'; start = m.index; inner = m[1]; }
    else { m = /(^|[^*])\*([^*\s](?:[^*]*[^*\s])?)\*$/.exec(t); if (m){ tag = 'i'; start = m.index + m[1].length; inner = m[2]; } }
  }
  if (!tag) return;
  const after = node.nodeValue.slice(off);
  const el = document.createElement(tag); el.textContent = inner;
  const before = document.createTextNode(node.nodeValue.slice(0, start)), tail = document.createTextNode('\u200b' + after);
  node.replaceWith(before, el, tail);
  caretAt(tail, 1);                      // la pastille invisible permet de sortir de la mise en forme ; elle est retirée dès la frappe suivante
}
function stripZw(){
  if (!text.innerHTML.includes('\u200b')) return;
  const w = document.createTreeWalker(text, NodeFilter.SHOW_TEXT), nodes = [], s = getSelection();
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const v = n.nodeValue; if (!v.includes('\u200b') || v === '\u200b') return;
    const isA = s.rangeCount && s.anchorNode === n, off = isA ? s.anchorOffset : 0;
    const lost = isA ? v.slice(0, off).split('\u200b').length - 1 : 0;
    n.nodeValue = v.replace(/\u200b/g, ''); if (isA) caretAt(n, Math.max(0, off - lost));
  });
}

/* ---------- historique des versions (local à l'appareil) ---------- */
const MAX_VERSIONS = 40;
const lastSnap = {};
const vPut = v => idb(store('versions', 'readwrite').put(v));
const vDel = id => idb(store('versions', 'readwrite').delete(id));
const vByNote = nid => idb(store('versions', 'readonly').index('nid').getAll(nid)).then(a => a.sort((x, y) => y.ts - x.ts));
function sigOf(n){
  const s = JSON.stringify([n.title, n.html, n.strokes, n.objs, n.bgs, n.bg, n.h, n.fs]);
  let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36) + ':' + s.length;
}
const snapBusy = {};
async function snapshot(n, label, gap){
  if (!db || !n || n.purged || n.deleted || snapBusy[n.id]) return false;
  snapBusy[n.id] = true;
  try {
    const now = Date.now();
    if (!lastSnap[n.id]){ const l = await vByNote(n.id); lastSnap[n.id] = {ts:l[0] ? l[0].ts : 0, sig:l[0] ? l[0].sig : ''}; }
    const ls = lastSnap[n.id];
    if (gap && now - ls.ts < gap) return false;
    const sig = sigOf(n);
    if (sig === ls.sig) return false;
    const data = JSON.parse(JSON.stringify({title:n.title, html:n.html, text:n.text, strokes:n.strokes, objs:n.objs, bgs:n.bgs, bg:n.bg, h:n.h, fs:n.fs}));
    await vPut({id:n.id + ':' + now, nid:n.id, ts:now, sig, label:label || '', data});
    lastSnap[n.id] = {ts:now, sig};
    const all = await vByNote(n.id);
    for (const v of all.slice(MAX_VERSIONS)) await vDel(v.id);
    return true;
  } catch (e) { return false; }
  finally { snapBusy[n.id] = false; }
}
async function purgeVersions(nid){
  delete lastSnap[nid];
  if (!db) return;
  try { (await vByNote(nid)).forEach(v => vDel(v.id)); } catch (e) {}
}
function drawThumb(cv, d){
  const g = cv.getContext('2d'); g.fillStyle = '#fffffe'; g.fillRect(0, 0, cv.width, cv.height);
  const k = cv.width / W;
  (d.strokes || []).forEach(s => drawStroke(g, s, k));
}
const fmtFull = ts => new Date(ts).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
function summary(d){
  const words = (d.text || '').split(/\s+/).filter(Boolean).length;
  return words + ' mot' + (words > 1 ? 's' : '') + ' · ' + (d.strokes || []).length + ' trait' + ((d.strokes || []).length > 1 ? 's' : '') + ' · ' + (d.objs || []).length + ' objet' + ((d.objs || []).length > 1 ? 's' : '');
}
async function restoreVersion(v){
  if (!cur) return;
  const n = cur;
  await snapshot(n, 'Avant restauration', 0);
  const d = JSON.parse(JSON.stringify(v.data));
  Object.assign(n, {title:d.title || '', html:d.html || '', text:d.text || '', strokes:d.strokes || [], objs:d.objs || [], bgs:d.bgs || [], bg:d.bg || 'lines', h:d.h || 1400, fs:d.fs || n.fs, updated:Date.now()});
  lastEdit = 'text';
  saveNote(n); openNote(n.id);
  toast('Version du ' + fmtFull(v.ts) + ' restaurée.');
}
async function historyDialog(){
  if (!cur || !db) return;
  commit();
  const n = cur;
  await snapshot(n, '', 60e3);
  let list = [];
  try { list = await vByNote(n.id); } catch (e) {}
  modal('Historique des versions', b => {
    const p = document.createElement('p');
    p.textContent = 'Des points de sauvegarde sont créés automatiquement (au plus un toutes les 10 minutes, et avant une restauration ou une synchronisation qui remplace la note). Les ' + MAX_VERSIONS + ' plus récents sont gardés sur cet appareil.';
    b.append(p);
    if (!list.length){
      const q = document.createElement('p'); q.textContent = 'Aucune version enregistrée pour l’instant. Écris ou dessine un peu : la première apparaîtra ici.'; b.append(q); return;
    }
    list.forEach((v, i) => {
      const row = document.createElement('div'); row.className = 'vrow';
      const cv = document.createElement('canvas'); cv.width = 192; cv.height = 256; cv.className = 'vthumb'; drawThumb(cv, v.data);
      const info = document.createElement('div'); info.className = 'vinfo';
      const t = document.createElement('div'); t.className = 'vt'; t.textContent = fmtFull(v.ts) + (v.label ? ' — ' + v.label : '') + (i === 0 && v.sig === sigOf(n) ? ' (actuelle)' : '');
      const s = document.createElement('div'); s.className = 'vs'; s.textContent = summary(v.data);
      const x = document.createElement('div'); x.className = 'vx'; x.textContent = (v.data.text || '').trim().replace(/\s+/g, ' ').slice(0, 90) || '—';
      info.append(t, s, x);
      if (!(i === 0 && v.sig === sigOf(n))){
        const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = 'Restaurer';
        btn.onclick = () => { if (confirm('Restaurer cette version ? La version actuelle est conservée dans l’historique.')){ dlg.close(); restoreVersion(v); } };
        info.append(btn);
      }
      row.append(cv, info); b.append(row);
    });
  });
}

/* ---------- liens entre notes [[Titre]], rétroliens, tags #mot ---------- */
const liveNotes = () => notes.filter(n => !n.purged && !n.deleted);
const findByTitle = t => { t = String(t).trim().toLowerCase(); return t ? liveNotes().find(n => (n.title || '').trim().toLowerCase() === t) : null; };

/* tags */
const TAG_RE = /(^|[\s(,;:])#([\p{L}\p{N}_-]{2,32})(?![\p{L}\p{N}_-])/gu;
let tagSig = '';
const tagMemo = new Map();
function tagsOf(n){
  const t = n.text || '';
  let r = tagMemo.get(t); if (r) return r;
  const set_ = new Set(); let m; TAG_RE.lastIndex = 0;
  while ((m = TAG_RE.exec(t))){ const g = m[2].toLowerCase(); if (!/^\d+$/.test(g) && !/^([0-9a-f]{3}|[0-9a-f]{6})$/.test(g)) set_.add(g); }
  r = [...set_]; if (tagMemo.size > 500) tagMemo.clear(); tagMemo.set(t, r); return r;
}
function tagList(){
  const c = new Map();
  liveNotes().forEach(n => tagsOf(n).forEach(t => c.set(t, (c.get(t) || 0) + 1)));
  return [...c.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'fr'));
}

/* liens */
function tryWikiLink(){
  const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return;
  const node = s.anchorNode; if (!node || node.nodeType !== 3 || !text.contains(node)) return;
  if (node.parentElement.closest('a,code')) return;
  const off = s.anchorOffset, m = /\[\[([^\[\]\n]{1,80})\]\]$/.exec(node.nodeValue.slice(0, off)); if (!m) return;
  const title = m[1].trim(); if (!title) return;
  let target = findByTitle(title), created = false;
  if (!target){ target = newNote(); target.title = title; notes.unshift(target); saveNote(target); created = true; }
  const a = document.createElement('a'); a.className = 'wl'; a.setAttribute('data-n', target.id); a.textContent = target.title || title;
  const start = off - m[0].length;
  const b4 = document.createTextNode(node.nodeValue.slice(0, start)), tail = document.createTextNode(' ' + node.nodeValue.slice(off));
  node.replaceWith(b4, a, tail); caretAt(tail, 1);
  if (created){ renderChips(); renderList(); toast('Note « ' + title + ' » créée.', {label:'Annuler', fn:() => { trashNote(target); }}); }
}
function refreshWiki(){
  text.querySelectorAll('a.wl').forEach(a => {
    const n = notes.find(x => x.id === a.getAttribute('data-n')), ok = n && !n.purged && !n.deleted;
    a.classList.toggle('dead', !ok);
    a.title = ok ? 'Ouvrir la note (Maj + clic : à côté)' : 'Cette note n’existe plus';
  });
}
text.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a.wl'); if (!a) return;
  e.preventDefault();
  const id = a.getAttribute('data-n'), n = notes.find(x => x.id === id && !x.purged && !x.deleted);
  if (!n){ toast('Cette note n’existe plus.'); return; }

    if (e.shiftKey || e.altKey) parent.postMessage({open:id}, location.origin);

    else openNote(id);
  } else if (e.shiftKey || e.altKey) openInPane(id);
  else openNote(id);
});
function insertNoteLink(n, label){
  text.focus();
  if (!getSelection().rangeCount || !text.contains(getSelection().anchorNode)){ restoreSel(); }
  if (!getSelection().rangeCount || !text.contains(getSelection().anchorNode)){
    const r = document.createRange(); r.selectNodeContents(text); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  exec('insertHTML', '<a class="wl" data-n="' + n.id + '">' + esc(label || n.title || 'Sans titre') + '</a>&nbsp;');

}

    const q = document.createElement('input'); q.type = 'search'; q.placeholder = 'Rechercher une note'; q.autocomplete = 'off'; q.setAttribute('aria-label', 'Rechercher une note');
    const ul = document.createElement('div'); ul.className = 'pick'; b.append(q, ul);
    const draw = () => {
      const s = q.value.trim().toLowerCase(); ul.textContent = '';
      liveNotes().filter(n => n.id !== o.exclude && (!s || (n.title + ' ' + n.text).toLowerCase().includes(s))).sort((a, b) => b.updated - a.updated).slice(0, 40).forEach(n => {
        const x = document.createElement('button'); x.className = 'btn pickrow'; x.textContent = n.title || 'Sans titre';
        x.onclick = () => { dlg.close(); onPick(n); }; ul.append(x);
      });

      back.slice(0, 8).forEach(n => {
        const b = document.createElement('button'); b.className = 'chip sm'; b.textContent = n.title || 'Sans titre';
        b.onclick = () => { if (IS_PANE) parent.postMessage({open:n.id}, location.origin); else openNote(n.id); };
        bar.append(b);
      });
    }
  }
  if (!IS_PANE && tagList().join('|') !== tagSig) renderChips();
}

/* synchronisation entre éditeurs (fenêtre principale <-> note à côté) */
const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('mattnotes') : null;
const bcSend = id => { try { bc && bc.postMessage({id}); } catch (e) {} };
if (bc) bc.onmessage = async e => {
  const id = e.data && e.data.id; if (!id || !db) return;
  let r; try { r = await idb(store('notes', 'readonly').get(id)); } catch (x) { return; }
  if (!r) return;
  const n = Object.assign(newNote(), {fs:18}, r); if (!Array.isArray(n.objs)) n.objs = []; if (!Array.isArray(n.bgs)) n.bgs = [];
  const i = notes.findIndex(x => x.id === id);
  if (i >= 0 && notes[i].updated >= n.updated) return;
  if (cur && cur.id === id){ notes[i] = n; openNote(id); return; }
  if (i >= 0) notes[i] = n; else notes.push(n);
  renderChips(); renderList(); renderRefs();
};

/* ---------- vue scindée : une 2e note modifiable à côté (iframe de l'appli elle-même) ---------- */
let paneId = '', mainId = '', paneLoaded = false;
const paneF = $('#paneF');
const wide = () => matchMedia('(min-width:1000px) and (min-height:521px)').matches;
const pageURL = () => location.href.split('#')[0].split('?')[0];

function openInPane(id){
  if (IS_PANE) return;
  const n = findById(id); if (!n || n.purged || n.deleted) return;
  if (!wide()){ toast('Écran trop étroit pour afficher deux notes côte à côte.'); return; }
  if (cur && cur.id === id){ toast('Cette note est déjà ouverte ici.'); return; }
  commit();
  if (document.body.classList.contains('split') && paneLoaded) paneF.contentWindow.postMessage({open:id}, location.origin);
  else { paneLoaded = false; paneF.src = pageURL() + '?pane=' + encodeURIComponent(id); document.body.classList.add('split'); }
  paneId = id;
}
function closePane(){
  if (!document.body.classList.contains('split')) return;
  try { if (paneLoaded) paneF.contentWindow.postMessage({flush:1}, location.origin); } catch (e) {}
  document.body.classList.remove('split'); paneId = ''; paneLoaded = false;
  setTimeout(() => { if (!document.body.classList.contains('split')) paneF.src = 'about:blank'; }, 300);
}
function swapPane(){
  if (!paneId || !paneLoaded) return;
  const other = paneId, mine = cur ? cur.id : '';
  commit(); paneF.contentWindow.postMessage({flush:1}, location.origin);
  setTimeout(() => {
    paneId = ''; openNote(other);
    if (mine){ paneF.contentWindow.postMessage({open:mine}, location.origin); paneId = mine; } else closePane();
  }, 300);
}
function syncPane(){
  if (IS_PANE) parent.postMessage({pane:cur ? cur.id : ''}, location.origin);
  else if (paneLoaded) paneF.contentWindow.postMessage({main:cur ? cur.id : ''}, location.origin);
}
addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  const d = e.data || {};
  if (IS_PANE){
    if (d.main !== undefined) mainId = d.main;
    if (d.open){ if (d.open === mainId) toast('Cette note est déjà ouverte à gauche.'); else openNote(d.open); }
    if (d.flush) commit();
  } else {
    if (e.source !== paneF.contentWindow) return;
    if (d.ready){ paneLoaded = true; syncPane(); }
    if (d.pane !== undefined && d.pane) paneId = d.pane;
    if (d.open) openNote(d.open);
  }
});
if (!IS_PANE){
  $('#paneX').onclick = closePane;
  $('#paneSw').onclick = swapPane;
  $('#splitBtn').onclick = () => { closeMenus(); notePicker('Ouvrir à côté', n => openInPane(n.id), {exclude:cur && cur.id}); };
  addEventListener('resize', () => { if (!wide() && document.body.classList.contains('split')) closePane(); });
}

/* ---------- plein écran : masque la liste, ne garde que la page ---------- */
Object.assign(IC, {full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', fullOff:'<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>'});
function setFocus(on){
  document.body.classList.toggle('focus', on);
  const b = $('#focusBtn'); b.setAttribute('aria-pressed', on); b.innerHTML = svg(on ? 'fullOff' : 'full');
  try {
    if (on && !document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (e) {}
}
if (!IS_PANE){
  setFocus(false);
  $('#focusBtn').onclick = () => setFocus(!document.body.classList.contains('focus'));
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f'){ e.preventDefault(); setFocus(!document.body.classList.contains('focus')); }
    else if (e.key === 'Escape' && document.body.classList.contains('focus') && !dlg.open) setFocus(false);
  });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('focus')) setFocus(false); });
}

/* ---------- app installable (PWA) ---------- */
if (!IS_PANE && 'serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
if (!IS_PANE && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- démarrage ---------- */
(async () => {
  try {
    db = await openDB();
    notes = (await dbAll()).map(n => Object.assign(newNote(), {fs:18}, n));
    notes.forEach(n => { if (!Array.isArray(n.objs)) n.objs = []; if (!Array.isArray(n.bgs)) n.bgs = []; });
  } catch (e) { toast('Stockage local indisponible : les notes ne seront pas conservées.'); }
  markTools(); updateZoomUI();
  if (IS_PANE){
    const id = new URLSearchParams(location.search).get('pane');
    if (notes.some(n => n.id === id && !n.purged && !n.deleted)) openNote(id);
    parent.postMessage({ready:1}, location.origin);
    return;
  }
  autoPurge();
  renderChips();
  const live_ = notes.filter(n => !n.purged && !n.deleted);
  if (!live_.length) createNote();
  else {
    renderList();
    const last = live_.find(n => n.id === set.last);
    if (last && matchMedia('(min-width:761px) and (min-height:521px)').matches) openNote(last.id);
  }
  if (syncCfg()){ setSyncInfo('Synchronisation…'); setTimeout(() => runSync(false), 1500); }
})();
</script>
